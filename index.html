<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园在线考试与自动评卷系统 - 数据产业学院</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        /* 登录注册页面 */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .auth-box {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 400px;
            max-width: 90%;
        }
        .auth-box h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .auth-box .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
            width: auto;
        }
        .btn-danger {
            background: linear-gradient(135deg, #f5365c 0%, #fb434a 100%);
        }
        .btn-success {
            background: linear-gradient(135deg, #2ed573 0%, #26de81 100%);
        }
        .auth-switch {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        .auth-switch a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
        }
        .role-toggle {
            display: flex;
            margin-bottom: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            padding: 4px;
        }
        .role-toggle button {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }
        .role-toggle button.active {
            background: white;
            color: #667eea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        /* 主应用 */
        .app-container {
            display: none;
        }
        .app-header {
            background: white;
            border-radius: 15px;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .app-header h2 {
            color: #667eea;
            font-size: 20px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
        .nav-tabs {
            background: white;
            border-radius: 15px;
            padding: 10px;
            display: flex;
            gap: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            overflow-x: auto;
        }
        .nav-tab {
            padding: 12px 24px;
            border: none;
            background: transparent;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            color: #666;
            white-space: nowrap;
            transition: all 0.3s;
        }
        .nav-tab:hover {
            background: #f5f5f5;
        }
        .nav-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .page {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .page.active {
            display: block;
        }
        .page-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        /* 表格样式 */
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }
        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }
        tr:hover {
            background: #f8f9fa;
        }
        /* 卡片网格 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 25px;
            color: white;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .card h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }
        .card p {
            opacity: 0.9;
            font-size: 14px;
        }
        .card .card-meta {
            margin-top: 15px;
            font-size: 12px;
            opacity: 0.8;
        }
        .card-grid-2 {
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        }
        /* 表单 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h3 {
            font-size: 20px;
            color: #333;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }
        /* 考试页面 */
        .exam-header {
            background: white;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .timer {
            font-size: 24px;
            font-weight: bold;
            color: #f5365c;
        }
        .timer.warning {
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .exam-body {
            display: flex;
            gap: 20px;
        }
        .question-panel {
            flex: 1;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .question-nav {
            width: 200px;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            max-height: 600px;
            overflow-y: auto;
        }
        .question-nav h4 {
            margin-bottom: 15px;
            color: #333;
        }
        .question-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        .question-num {
            width: 36px;
            height: 36px;
            border: 2px solid #ddd;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.3s;
        }
        .question-num:hover {
            border-color: #667eea;
        }
        .question-num.current {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }
        .question-num.answered {
            background: #2ed573;
            border-color: #2ed573;
            color: white;
        }
        .question-num.flag {
            border-color: #ffa502;
            background: #ffa502;
            color: white;
        }
        .question-content {
            margin-bottom: 30px;
        }
        .question-type {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 15px;
        }
        .question-text {
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        .option-list {
            list-style: none;
        }
        .option-item {
            padding: 15px 20px;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .option-item:hover {
            border-color: #667eea;
        }
        .option-item.selected {
            border-color: #667eea;
            background: #f0edff;
        }
        .option-item input {
            margin-right: 10px;
        }
        .fill-blank {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .fill-blank:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            font-family: inherit;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .question-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .flag-btn {
            background: #ffa502 !important;
        }
        .flag-btn.flagged {
            background: #ff6348 !important;
        }
        /* 答题卡 */
        .answer-card-legend {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            font-size: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-dot {
            width: 20px;
            height: 20px;
            border-radius: 5px;
            border: 2px solid #ddd;
        }
        .legend-dot.current {
            background: #667eea;
            border-color: #667eea;
        }
        .legend-dot.answered {
            background: #2ed573;
            border-color: #2ed573;
        }
        .legend-dot.flag {
            background: #ffa502;
            border-color: #ffa502;
        }
        /* 图表 */
        .chart-container {
            width: 100%;
            height: 400px;
            margin-top: 20px;
        }
        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 25px;
            color: white;
            text-align: center;
        }
        .stat-card.green {
            background: linear-gradient(135deg, #2ed573 0%, #26de81 100%);
        }
        .stat-card.orange {
            background: linear-gradient(135deg, #ffa502 0%, #ff7f50 100%);
        }
        .stat-card.red {
            background: linear-gradient(135deg, #f5365c 0%, #fb434a 100%);
        }
        .stat-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .stat-label {
            opacity: 0.9;
            font-size: 14px;
        }
        /* 警告提示 */
        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        .alert.active {
            display: block;
        }
        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        /* 搜索框 */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            font-size: 14px;
        }
        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 20px;
        }
        .pagination button {
            padding: 8px 12px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 5px;
            cursor: pointer;
        }
        .pagination button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #999;
        }
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        /* 标签 */
        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-right: 5px;
            margin-bottom: 5px;
        }
        .tag-primary {
            background: #e1eaff;
            color: #667eea;
        }
        .tag-success {
            background: #d4edda;
            color: #28a745;
        }
        .tag-warning {
            background: #fff3cd;
            color: #ffc107;
        }
        /* 进度条 */
        .progress-bar {
            height: 8px;
            background: #e1e1e1;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }
        /* 考试说明 */
        .exam-info {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .exam-info h3 {
            margin-bottom: 15px;
            color: #333;
        }
        .exam-info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e1e1e1;
        }
        .exam-info-item:last-child {
            border-bottom: none;
        }
        /* 防作弊提示 */
        .anti-cheat-alert {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #f5365c;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            display: none;
            z-index: 1001;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        /* 作弊记录 */
        .cheat-log {
            background: #fff3cd;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }
        .cheat-log h5 {
            color: #856404;
            margin-bottom: 10px;
        }
        .cheat-log-item {
            padding: 8px 0;
            border-bottom: 1px dashed #ffeeba;
            font-size: 13px;
            color: #856404;
        }
        /* 响应式 */
        @media (max-width: 768px) {
            .exam-body {
                flex-direction: column;
            }
            .question-nav {
                width: 100%;
            }
            .nav-tabs {
                flex-wrap: nowrap;
                overflow-x: auto;
            }
        }
        /* 加载动画 */
        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }
        .loading.active {
            display: block;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- 登录注册页面 -->
    <div class="auth-container" id="authPage">
        <div class="auth-box">
            <h1>🎓 校园在线考试系统</h1>
            <p class="subtitle">数据产业学院 · 在线考试与自动评卷</p>
            
            <div class="role-toggle">
                <button class="active" data-role="student">学生</button>
                <button data-role="teacher">教师</button>
            </div>
            
            <div id="loginForm">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="loginUsername" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" placeholder="请输入密码">
                </div>
                <button class="btn" onclick="handleLogin()">登 录</button>
                <div class="auth-switch">
                    还没有账号？<a onclick="switchToRegister()">立即注册</a>
                </div>
            </div>
            
            <div id="registerForm" style="display: none;">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="regUsername" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="regPassword" placeholder="请输入密码（至少6位）">
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="regConfirmPassword" placeholder="请再次输入密码">
                </div>
                <div class="form-group" id="studentClassGroup">
                    <label>班级</label>
                    <input type="text" id="regClass" placeholder="请输入班级，如：计算机1班">
                </div>
                <button class="btn" onclick="handleRegister()">注 册</button>
                <div class="auth-switch">
                    已有账号？<a onclick="switchToLogin()">立即登录</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 防作弊提示 -->
    <div class="anti-cheat-alert" id="antiCheatAlert">
        ⚠️ 检测到异常行为，已记录！
    </div>

    <!-- 主应用 -->
    <div class="app-container" id="appPage">
        <div class="container">
            <!-- 头部 -->
            <div class="app-header">
                <h2>🎓 校园在线考试系统</h2>
                <div class="user-info">
                    <span id="currentUserName">用户名</span>
                    <span class="tag tag-primary" id="currentUserRole">学生</span>
                    <button class="btn btn-small btn-secondary" onclick="logout()">退出</button>
                </div>
            </div>

            <!-- 教师端导航 -->
            <div class="nav-tabs" id="teacherNav" style="display: none;">
                <button class="nav-tab active" onclick="showPage('dashboard')">📊 控制台</button>
                <button class="nav-tab" onclick="showPage('questions')">📝 题库管理</button>
                <button class="nav-tab" onclick="showPage('exams')">📋 试卷管理</button>
                <button class="nav-tab" onclick="showPage('results')">📈 成绩管理</button>
            </div>

            <!-- 学生端导航 -->
            <div class="nav-tabs" id="studentNav" style="display: none;">
                <button class="nav-tab active" onclick="showPage('examCenter')">📚 考试中心</button>
                <button class="nav-tab" onclick="showPage('myResults')">📊 我的成绩</button>
            </div>

            <!-- 控制台页面 -->
            <div class="page active" id="dashboard">
                <h3 class="page-title">📊 数据概览</h3>
                <div class="stats-grid" id="dashboardStats"></div>
                <div class="chart-container" id="mainChart"></div>
            </div>

            <!-- 题库管理页面 -->
            <div class="page" id="questions">
                <h3 class="page-title">📝 题库管理</h3>
                <div class="search-box">
                    <input type="text" id="questionSearch" placeholder="搜索题目关键词...">
                    <select id="questionTypeFilter" onchange="loadQuestions()">
                        <option value="">全部题型</option>
                        <option value="single">单选题</option>
                        <option value="multiple">多选题</option>
                        <option value="judge">判断题</option>
                        <option value="fill">填空题</option>
                        <option value="essay">简答题</option>
                    </select>
                    <select id="questionSubjectFilter" onchange="loadQuestions()">
                        <option value="">全部科目</option>
                    </select>

        function checkLogin() {
            const savedUser = localStorage.getItem('currentUser');

        // ========== 认证功能 ==========
        function setupEventListeners() {
            // 角色切换
            document.querySelectorAll('.role-toggle button').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.role-toggle button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentRole = this.dataset.role;
                    
                    // 教师角色显示班级输入
                    const classGroup = document.getElementById('studentClassGroup');
                    if (currentRole === 'teacher') {
                        classGroup.style.display = 'none';
                    } else {
                        classGroup.style.display = 'block';
                    }
                });
            });

            // 题型切换时显示/隐藏选项
            document.getElementById('qType').addEventListener('change', function() {
                const type = this.value;
                const optionsContainer = document.getElementById('optionsContainer');
                const answerSelect = document.getElementById('answerSelect');
                
                if (type === 'single' || type === 'multiple') {
                    optionsContainer.style.display = 'block';
                    answerSelect.style.display = 'block';
                    if (type === 'multiple') {
                        answerSelect.querySelector('select').innerHTML = `
                            <option value="">请选择</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                            <option value="AB">AB</option>
                            <option value="AC">AC</option>
                            <option value="AD">AD</option>
                            <option value="BC">BC</option>
                            <option value="BD">BD</option>
                            <option value="CD">CD</option>
                            <option value="ABC">ABC</option>
                            <option value="ABD">ABD</option>
                            <option value="ACD">ACD</option>
                            <option value="BCD">BCD</option>
                            <option value="ABCD">ABCD</option>
                        `;
                    } else {
                        answerSelect.querySelector('select').innerHTML = `
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                        `;
                    }
                } else if (type === 'judge') {
                    optionsContainer.style.display = 'block';
                    document.getElementById('qOptionA').value = '正确';
                    document.getElementById('qOptionB').value = '错误';
                    document.getElementById('qOptionC').value = '';
                    document.getElementById('qOptionD').value = '';
                    answerSelect.style.display = 'block';
                    answerSelect.querySelector('select').innerHTML = `
                        <option value="A">A - 正确</option>
                        <option value="B">B - 错误</option>
                    `;
                } else if (type === 'fill' || type === 'essay') {
                    optionsContainer.style.display = 'none';
                    answerSelect.style.display = 'block';
                    if (type === 'fill') {
                        answerSelect.querySelector('select').innerHTML = '<option value="">请输入标准答案</option>';
                    } else {
                        answerSelect.querySelector('select').innerHTML = '<option value="">请输入关键词（用逗号分隔）</option>';
                    }
                }
            });

            // 题目搜索
            document.getElementById('questionSearch').addEventListener('input', loadQuestions);

        function switchToRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        }

        function switchToLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
        }

        function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                alert('请输入用户名和密码');
                return;
            }

            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const user = users.find(u => u.username === username && u.password === password);

            if (user) {
                currentUser = user;
                localStorage.setItem('currentUser', JSON.stringify(user));
                showApp();
            } else {
                alert('用户名或密码错误');
            }
        }

        function handleRegister() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const userClass = document.getElementById('regClass').value.trim();

            if (!username || !password) {
                alert('请填写完整信息');
                return;
            }

            if (password.length < 6) {
                alert('密码至少6位');
                return;
            }

            if (password !== confirmPassword) {
                alert('两次密码不一致');
                return;
            }

            if (currentRole === 'student' && !userClass) {
                alert('请输入班级');
                return;
            }

            const users = JSON.parse(localStorage.getItem('users') || '[]');
            
            if (users.find(u => u.username === username)) {
                alert('用户名已存在');
                return;
            }

            const newUser = {
                username,
                password,
                role: currentRole,
                name: username,
                class: currentRole === 'student' ? userClass : ''
            };

            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));

            currentUser = newUser;
            localStorage.setItem('currentUser', JSON.stringify(newUser));
            showApp();
        }

        function logout() {
            if (examInProgress) {
                if (!confirm('考试进行中，确定要退出吗？')) {
                    return;
                }
                clearInterval(examTimer);
                examInProgress = null;
            }
            localStorage.removeItem('currentUser');
            currentUser = null;
            document.getElementById('authPage').style.display = 'flex';
            document.getElementById('appPage').style.display = 'none';
        }

        function showApp() {
            document.getElementById('authPage').style.display = 'none';
            document.getElementById('appPage').style.display = 'block';
            
            document.getElementById('currentUserName').textContent = currentUser.name || currentUser.username;
            document.getElementById('currentUserRole').textContent = currentUser.role === 'teacher' ? '教师' : '学生';

            if (currentUser.role === 'teacher') {
                document.getElementById('teacherNav').style.display = 'flex';
                document.getElementById('studentNav').style.display = 'none';
                loadTeacherDashboard();
            } else {
                document.getElementById('teacherNav').style.display = 'none';
                document.getElementById('studentNav').style.display = 'flex';
                loadStudentDashboard();
            }

            showPage('dashboard');
        }

        function showPage(page) {

            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            
            const pageEl = document.getElementById(page);
            if (pageEl) pageEl.classList.add('active');
            
            const tabs = document.querySelectorAll('.nav-tab');
            tabs.forEach(t => {
                if (t.textContent.includes(getPageTitle(page))) {
                    t.classList.add('active');
                }
            });

            currentPage = page;

            // 加载页面数据
            switch(page) {
                case 'dashboard':
                    loadTeacherDashboard();
                    break;
                case 'questions':
                    loadQuestions();
                    break;
                case 'exams':
                    loadExams();
                    break;
                case 'results':
                    loadResults();
                    break;
                case 'examCenter':
                    loadExamCenter();
                    break;
                case 'myResults':
                    loadMyResults();
                    break;
            }
        }

        function openQuestionModal(id = null) {
            editingQuestionId = id;
            document.getElementById('questionModalTitle').textContent = id ? '编辑题目' : '添加题目';
            
            if (id) {
                const questions = JSON.parse(localStorage.getItem('questions') || '[]');
                const q = questions.find(q => q.id === id);
                if (q) {
                    document.getElementById('qType').value = q.type;
                    document.getElementById('qSubject').value = q.subject;
                    document.getElementById('qContent').value = q.content;
                    document.getElementById('qOptionA').value = q.options?.A || '';
                    document.getElementById('qOptionB').value = q.options?.B || '';
                    document.getElementById('qOptionC').value = q.options?.C || '';
                    document.getElementById('qOptionD').value = q.options?.D || '';
                    document.getElementById('qAnswer').value = q.answer;
                    document.getElementById('qScore').value = q.score;
                }
            } else {
                document.getElementById('qType').value = 'single';
                document.getElementById('qSubject').value = '数学';
                document.getElementById('qContent').value = '';
                document.getElementById('qOptionA').value = '';
                document.getElementById('qOptionB').value = '';
                document.getElementById('qOptionC').value = '';
                document.getElementById('qOptionD').value = '';
                document.getElementById('qAnswer').value = 'A';
                document.getElementById('qScore').value = '5';
            }
            
            document.getElementById('questionModal').classList.add('active');

        function editQuestion(id) {
            openQuestionModal(id);
        }

        function saveQuestion() {
            const type = document.getElementById('qType').value;
            const subject = document.getElementById('qSubject').value;
            const content = document.getElementById('qContent').value.trim();
            const answer = document.getElementById('qAnswer').value;
            const score = parseInt(document.getElementById('qScore').value);

            if (!content) {
                alert('请输入题目内容');
                return;
            }

            if (type !== 'fill' && type !== 'essay' && !answer) {
                alert('请选择正确答案');
                return;
            }

            let questions = JSON.parse(localStorage.getItem('questions') || '[]');
            
            const questionData = {
                id: editingQuestionId || Date.now(),
                type,
                subject,
                content,
                score
            };

            if (type === 'single' || type === 'multiple' || type === 'judge') {
                questionData.options = {
                    A: document.getElementById('qOptionA').value,
                    B: document.getElementById('qOptionB').value,
                    C: document.getElementById('qOptionC').value,
                    D: document.getElementById('qOptionD').value
                };
            }

            if (type === 'fill') {
                questionData.answer = answer;
            } else if (type === 'essay') {
                questionData.answer = answer;
            } else {
                questionData.answer = answer;
            }

            if (editingQuestionId) {
                const index = questions.findIndex(q => q.id === editingQuestionId);
                if (index !== -1) {
                    questions[index] = questionData;
                }
            } else {
                questions.push(questionData);
            }

            localStorage.setItem('questions', JSON.stringify(questions));
            closeModal('questionModal');
            loadQuestions();
            alert('保存成功！');
        }

            questions = questions.filter(q => q.id !== id);
            localStorage.setItem('questions', JSON.stringify(questions));
            loadQuestions();

                    '70-79': 0,
                    '80-89': 0,
                    '90-100': 0
                };
                
                results.forEach(r => {
                    if (r.score < 60) scoreGroups['0-59']++;
                    else if (r.score < 70) scoreGroups['60-69']++;
                    else if (r.score < 80) scoreGroups['70-79']++;
                    else if (r.score < 90) scoreGroups['80-89']++;

                chart.setOption({

                                return colors[params.dataIndex];
                            }
                        }
                    }]
                });
            }
        }

        // ========== 考试功能 ==========
        function startExam(examId) {
            const exams = JSON.parse(localStorage.getItem('exams') || '[]');
            const exam = exams.find(e => e.id === examId);
            
            if (!exam) {
                alert('试卷不存在');
                return;
            }

            // 检查是否已完成
            const results = JSON.parse(localStorage.getItem('results') || '[]');
            const myResult = results.find(r => r.examId === examId && r.userId === currentUser.username);
            if (myResult) {
                if (!confirm('您已参加过此考试，确定要重新考试吗？')) {
                    return;
                }
            }

            // 生成试卷
            const questions = JSON.parse(localStorage.getItem('questions') || '[]');
            const examQuestions = generateExam(questions, exam);
            
            if (examQuestions.length === 0) {
                alert('题库题目不足，无法生成试卷');
                return;
            }

            examInProgress = {
                ...exam,
                questions: examQuestions
            };
            examAnswers = {};
            examFlagged = {};
            cheatLogs = [];
            examStartTime = Date.now();

            // 显示考试信息
            const totalScore = exam.config.single * exam.config.singleScore + 
                               exam.config.multi * exam.config.multiScore +
                               exam.config.judge * exam.config.judgeScore +
                               exam.config.fill * exam.config.fillScore +
                               exam.config.essay * exam.config.essayScore;

            document.getElementById('examInfo').innerHTML = `
                <h3>${exam.name}</h3>
                <div class="exam-info-item"><span>科目：</span><span>${exam.subject}</span></div>
                <div class="exam-info-item"><span>考试时长：</span><span>${exam.duration}分钟</span></div>
                <div class="exam-info-item"><span>总分：</span><span>${totalScore}分</span></div>
                <div class="exam-info-item"><span>及格分：</span><span>${exam.passScore}分</span></div>
                <div class="exam-info-item"><span>题目数量：</span><span>${examQuestions.length}题</span></div>
                <div style="margin-top: 15px;">
                    <button class="btn btn-success" onclick="beginExam()">开始考试</button>
                    <button class="btn btn-secondary" onclick="cancelExam()">返回</button>
                </div>
            `;

            document.getElementById('examInfo').style.display = 'block';
            document.getElementById('examTimer').style.display = 'none';
            document.getElementById('questionPanel').style.display = 'none';
            document.getElementById('questionNav').style.display = 'none';
        }

        function beginExam() {
            document.getElementById('examInfo').style.display = 'none';
            document.getElementById('examTimer').style.display = 'block';
            document.getElementById('questionPanel').style.display = 'block';
            document.getElementById('questionNav').style.display = 'block';

            document.getElementById('examTitle').textContent = examInProgress.name;
            document.getElementById('totalCount').textContent = examInProgress.questions.length;

            // 生成答题卡
            generateQuestionGrid();
            
            // 开始计时
            let remaining = examInProgress.duration * 60;
            updateTimer(remaining);
            examTimer = setInterval(() => {
                remaining--;
                updateTimer(remaining);
                if (remaining <= 0) {
                    clearInterval(examTimer);
                    submitExam();
                }
            }, 1000);

            // 显示第一题
            currentQuestionIndex = 0;
            showQuestion(0);
        }

        function updateTimer(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            document.getElementById('examTimer').textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            
            if (seconds <= 300) {
                document.getElementById('examTimer').classList.add('warning');
            } else {
                document.getElementById('examTimer').classList.remove('warning');
            }
        }

        let currentQuestionIndex = 0;

        function generateExam(questions, exam) {
            const examQuestions = [];
            const config = exam.config;

            // 按题型分组
            const grouped = {
                single: questions.filter(q => q.type === 'single'),
                multiple: questions.filter(q => q.type === 'multiple'),
                judge: questions.filter(q => q.type === 'judge'),
                fill: questions.filter(q => q.type === 'fill'),
                essay: questions.filter(q => q.type === 'essay')
            };

            // 随机抽取
            const shuffle = arr => arr.sort(() => Math.random() - 0.5);
            
            const addQuestions = (type, count) => {
                const pool = shuffle([...grouped[type]]);
                for (let i = 0; i < count && i < pool.length; i++) {
                    const q = { ...pool[i] };
                    q.score = config[type + 'Score'];
                    examQuestions.push(q);
                }
            };

            addQuestions('single', config.single);
            addQuestions('multiple', config.multi);
            addQuestions('judge', config.judge);
            addQuestions('fill', config.fill);
            addQuestions('essay', config.essay);

            return examQuestions;
        }

        function generateQuestionGrid() {
            const grid = document.getElementById('questionGrid');
            grid.innerHTML = examInProgress.questions.map((q, i) => `
                <div class="question-num" data-index="${i}" onclick="jumpToQuestion(${i})">${i + 1}</div>
            `).join('');
            updateQuestionGrid();
        }

        function updateQuestionGrid() {
            document.querySelectorAll('.question-num').forEach((el, i) => {
                el.classList.remove('current', 'answered', 'flag');
                if (i === currentQuestionIndex) {
                    el.classList.add('current');
                } else if (examFlagged[i]) {
                    el.classList.add('flag');
                } else if (examAnswers[i] !== undefined && examAnswers[i] !== '') {
                    el.classList.add('answered');
                }
            });

            const answered = Object.keys(examAnswers).filter(k => examAnswers[k] !== '').length;
            document.getElementById('answeredCount').textContent = answered;
            document.getElementById('examProgress').style.width = `${(answered / examInProgress.questions.length) * 100}%`;
        }

        function showQuestion(index) {
            currentQuestionIndex = index;
            const q = examInProgress.questions[index];
            
            const typeNames = {
                'single': '单选题',
                'multiple': '多选题（多选）',
                'judge': '判断题',
                'fill': '填空题',
                'essay': '简答题'
            };

            document.getElementById('questionType').textContent = typeNames[q.type] + ' (' + q.score + '分)';
            document.getElementById('questionText').textContent = (index + 1) + '. ' + q.content;

            const optionsContainer = document.getElementById('questionOptions');
            const fillInput = document.getElementById('fillBlankInput');
            const essayInput = document.getElementById('essayInput');

            optionsContainer.style.display = 'none';
            fillInput.style.display = 'none';
            essayInput.style.display = 'none';

            if (q.type === 'single' || q.type === 'multiple') {
                optionsContainer.style.display = 'block';
                optionsContainer.innerHTML = Object.entries(q.options)
                    .filter(([k, v]) => v)
                    .map(([key, value]) => `
                        <li class="option-item ${getOptionClass(key)}" onclick="selectOption('${key}')">
                            <label>
                                ${q.type === 'multiple' ? '<input type="checkbox" name="option" value="' + key + '">' : ''}
                                <strong>${key}.</strong> ${value}
                            </label>
                        </li>
                    `).join('');
            } else if (q.type === 'judge') {
                optionsContainer.style.display = 'block';
                optionsContainer.innerHTML = Object.entries(q.options)
                    .filter(([k, v]) => v)
                    .map(([key, value]) => `
                        <li class="option-item ${getOptionClass(key)}" onclick="selectOption('${key}')">
                            <label>
                                <strong>${key}.</strong> ${value}
                            </label>
                        </li>
                    `).join('');
            } else if (q.type === 'fill') {
                fillInput.style.display = 'block';
                fillInput.innerHTML = `<input type="text" class="fill-blank" id="fillAnswer" placeholder="请输入答案" value="${examAnswers[index] || ''}" oninput="saveFillAnswer()">`;
            } else if (q.type === 'essay') {
                essayInput.style.display = 'block';
                document.getElementById('essayAnswer').value = examAnswers[index] || '';
            }

            // 更新标记按钮
            const flagBtn = document.getElementById('flagBtn');
            if (examFlagged[index]) {
                flagBtn.classList.add('flagged');
                flagBtn.textContent = '📌 已标记';
            } else {
                flagBtn.classList.remove('flagged');
                flagBtn.textContent = '📌 标记';
            }

            // 更新导航按钮
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === examInProgress.questions.length - 1;

            updateQuestionGrid();
        }

        function getOptionClass(key) {
            const answer = examAnswers[currentQuestionIndex];
            if (!answer) return '';
            if (typeof answer === 'string' && answer.includes(key)) {
                return 'selected';
            }
            if (answer === key) {
                return 'selected';
            }
            return '';
        }

        function selectOption(key) {
            const q = examInProgress.questions[currentQuestionIndex];
            
            if (q.type === 'multiple') {
                let current = examAnswers[currentQuestionIndex] || '';
                if (current.includes(key)) {
                    current = current.replace(key, '');
                } else {
                    current += key;
                }
                current = current.split('').sort().join('');
                examAnswers[currentQuestionIndex] = current;
            } else {
                examAnswers[currentQuestionIndex] = key;
            }
            
            showQuestion(currentQuestionIndex);
        }

        function saveFillAnswer() {
            examAnswers[currentQuestionIndex] = document.getElementById('fillAnswer').value;
            updateQuestionGrid();
        }

        function saveEssayAnswer() {
            examAnswers[currentQuestionIndex] = document.getElementById('essayAnswer').value;
            updateQuestionGrid();
        }

        document.addEventListener('input', function(e) {
            if (e.target.id === 'essayAnswer') {
                examAnswers[currentQuestionIndex] = e.target.value;
                updateQuestionGrid();
            }
        });

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                showQuestion(currentQuestionIndex - 1);
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < examInProgress.questions.length - 1) {
                showQuestion(currentQuestionIndex + 1);
            }
        }

        function jumpToQuestion(index) {
            showQuestion(index);
        }

        function toggleFlag() {
            examFlagged[currentQuestionIndex] = !examFlagged[currentQuestionIndex];
            showQuestion(currentQuestionIndex);
        }

        function cancelExam() {
            if (confirm('确定要退出考试吗？')) {
                clearInterval(examTimer);
                examInProgress = null;
                if (currentUser.role === 'student') {
                    loadExamCenter();
                    showPage('examCenter');
                } else {
                    showPage('dashboard');
                }
            }
        }

        function confirmSubmit() {
            const unanswered = examInProgress.questions.length - Object.keys(examAnswers).filter(k => examAnswers[k] !== '').length;
            
            let msg = '确定要交卷吗？';
            if (unanswered > 0) {
                msg = `还有 ${unanswered} 题未答，确定要交卷吗？`;
            }
            
            if (confirm(msg)) {
                submitExam();
            }
        }

        function submitExam() {
            clearInterval(examTimer);
            
            // 评分
            const results = autoGrade();
            
            // 保存成绩
            const allResults = JSON.parse(localStorage.getItem('results') || '[]');
            
            // 删除之前的成绩
            const filtered = allResults.filter(r => !(r.examId === examInProgress.id && r.userId === currentUser.username));
            
            const timeUsed = formatTimeUsed(Date.now() - examStartTime);
            
            filtered.push({
                examId: examInProgress.id,
                userId: currentUser.username,
                userName: currentUser.name || currentUser.username,
                className: currentUser.class,
                score: results.totalScore,
                timeUsed: timeUsed,
                submitTime: new Date().toISOString(),
                cheatLogs: [...cheatLogs],
                details: results.details
            });
            
            localStorage.setItem('results', JSON.stringify(filtered));
            
            // 显示成绩
            alert(`考试完成！\n您的得分：${results.totalScore}分\n用时：${timeUsed}`);
            
            examInProgress = null;
            
            if (currentUser.role === 'student') {
                loadMyResults();
                showPage('myResults');
            } else {
                loadResults();
                showPage('results');
            }
        }

        function autoGrade() {
            let totalScore = 0;
            const details = [];

            examInProgress.questions.forEach((q, i) => {
                const userAnswer = examAnswers[i] || '';
                let score = 0;
                let correctAnswer = '';

                if (q.type === 'single' || q.type === 'judge') {
                    correctAnswer = q.answer;
                    if (userAnswer === q.answer) {
                        score = q.score;
                    }
                } else if (q.type === 'multiple') {
                    correctAnswer = q.answer;
                    const userSorted = (userAnswer || '').split('').sort().join('');
                    const correctSorted = q.answer.split('').sort().join('');
                    if (userSorted === correctSorted) {
                        score = q.score;
                    }
                } else if (q.type === 'fill') {
                    correctAnswer = q.answer;
                    // 填空题：包含关键词即得分
                    if (userAnswer.toLowerCase().includes(q.answer.toLowerCase())) {
                        score = q.score;
                    }
                } else if (q.type === 'essay') {
                    correctAnswer = q.answer;
                    // 简答题：关键词匹配
                    const keywords = q.answer.split(/[,，]/).map(k => k.trim()).filter(k => k);
                    const userText = userAnswer.toLowerCase();
                    let matchCount = 0;
                    keywords.forEach(k => {
                        if (userText.includes(k.toLowerCase())) {
                            matchCount++;
                        }
                    });
                    score = Math.round((matchCount / keywords.length) * q.score);
                }

                totalScore += score;
                details.push({
                    type: q.type,
                    content: q.content,
                    userAnswer: userAnswer,
                    correctAnswer: correctAnswer,
                    score: score,
                    maxScore: q.score
                });
            });

            return { totalScore, details };
        }

        function formatTimeUsed(ms) {
            const seconds = Math.floor(ms / 1000);
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}分${secs}秒`;
        }

        // ========== 防作弊功能 ==========
        function setupAntiCheat() {
            // 切屏检测
            document.addEventListener('visibilitychange', function() {
                if (document.hidden && examInProgress) {
                    logCheat('切换到其他标签页/窗口');
                }
            });

            // 右键菜单
            document.addEventListener('contextmenu', function(e) {
                if (examInProgress) {
                    e.preventDefault();
                    logCheat('尝试使用右键菜单');
                }
            });

            // 复制粘贴
            document.addEventListener('copy', function(e) {
                if (examInProgress) {
                    e.preventDefault();
                    logCheat('尝试复制内容');
                }
            });

            document.addEventListener('paste', function(e) {
                if (examInProgress) {
                    e.preventDefault();
                    logCheat('尝试粘贴内容');
                }
            });

            // 键盘快捷键
            document.addEventListener('keydown', function(e) {
                if (examInProgress) {
                    if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'a')) {
                        e.preventDefault();
                        logCheat('尝试使用Ctrl+' + e.key.toUpperCase());
                    }
                    if (e.key === 'F5') {
                        e.preventDefault();
                        logCheat('尝试按F5刷新');
                    }
                }
            });
        }

        function logCheat(action) {
            const timestamp = new Date().toLocaleString();
            cheatLogs.push({ action, timestamp });
            
            // 显示警告
            const alert = document.getElementById('antiCheatAlert');
            alert.textContent = '⚠️ ' + action + '，已记录！';
            alert.style.display = 'block';
            setTimeout(() => {
                alert.style.display = 'none';
            }, 3000);
        }

        // ========== 模态框 ==========
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // 点击模态框外部关闭
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('active');
                }
            });
        });
    </script>
</body>
